version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20 # 確保這行在這裡，並設定為 20 或更高的版本
    commands:
      - echo "Installing dependencies..."
      - npm install
  build:
    commands:
      - echo "Building the project..."
      - npm run build
artifacts:
  base-directory: dist
  files:
    - '**/*'